<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/app_icon.svg" />
    <title>AI Agent Gateway</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Surface a content-free bootstrap failure instead of a white page.
      // Raw messages, filenames, stacks, rejection values, and URLs may hold
      // credentials or local paths and must never be rendered here.
      function showBootstrapFailure() {
        var el = document.getElementById('root');
        if (el) {
          el.innerHTML =
            '<pre style="padding:16px;color:#d33;white-space:pre-wrap;font-size:13px">' +
            'AAG could not start the interface. Restart the application and use Diagnostics if the problem continues.' +
            '</pre>';
        }
      }
      window.addEventListener('error', showBootstrapFailure);
      window.addEventListener('unhandledrejection', showBootstrapFailure);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
