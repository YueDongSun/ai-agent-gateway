name: desktop_build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows_x64
            runner: windows-latest
            target: ''
          - name: macos_x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: macos_arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: ubuntu_x64
            runner: ubuntu-22.04
            target: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install_linux_dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: setup_node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: install_rust_stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-01
        with:
          targets: ${{ matrix.target }}
      - name: restore_rust_cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target
      - name: install_root_dependencies
        run: npm ci --ignore-scripts
      - name: install_ui_dependencies
        run: npm ci --prefix ui --ignore-scripts
      - name: verify_node_and_ui
        run: npm run typecheck && npm test && npm run test:desktop_runner && npm run test:ui_smoke_runner && npm --prefix ui run typecheck && npm run ui:build
      - name: verify_release_inputs
        run: npm run release:verify
      - name: build_desktop
        run: npm run desktop:build -- ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: upload_desktop_artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai_agent_gateway_${{ matrix.name }}
          path: src-tauri/target/**/bundle/**
          if-no-files-found: error
