name: privacy_gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy_gate:
    name: privacy_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: checkout_reviewed_tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: setup_node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: install_dependencies
        run: npm ci --ignore-scripts
      - name: test_privacy_tooling
        run: npm run test:privacy
      - name: audit_repository_tree
        run: npm run privacy:audit
