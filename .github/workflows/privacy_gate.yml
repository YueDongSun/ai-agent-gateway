name: privacy_gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy_gate:
    name: privacy_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: checkout_reviewed_tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: setup_node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: install_dependencies
        run: npm ci --ignore-scripts
      - name: test_privacy_tooling
        run: npm run test:privacy
      - name: verify_public_snapshot
        run: |
          rm -rf /tmp/gate-tree && mkdir -p /tmp/gate-tree
          git archive HEAD | tar -x -C /tmp/gate-tree
          node -e "
          const { execSync } = require('node:child_process');
          const run = (cmd) => execSync(cmd, { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 });
          let report;
          try {
            report = JSON.parse(run('node scripts/privacy/audit_repository.mjs --directory /tmp/gate-tree'));
          } catch (err) {
            report = JSON.parse((err.stdout || '').toString());
          }
          const manifest = JSON.parse(require('node:fs').readFileSync('/tmp/gate-tree/public_snapshot_manifest.json', 'utf8'));
          const removed = new Set(manifest.files.map((f) => f.path).filter((p) => {
            const rules = JSON.parse(require('node:fs').readFileSync('/tmp/gate-tree/scripts/privacy/public_export_policy.json', 'utf8')).export_excluded_paths;
            return rules.some((rule) => (rule.endsWith('/') ? p.startsWith(rule) : p === rule));
          }));
          const allowedUnmanifested = new Set(['CHANGELOG_PUBLIC_BASELINE.md', 'CHANGELOG.md', 'package-lock.json', 'ui/package-lock.json']);
          const allowedMismatch = new Set(['README.md', 'AGENTS.md', 'CLAUDE.md', 'GEMINI.md', 'DESIGN.md', 'docs/README.md', 'docs/project_structure.md', '.github/workflows/privacy_gate.yml', 'scripts/privacy/public_export_policy.json']);
          const bad = (report.findings || []).filter((f) => !((f.category === 'public_snapshot_unmanifested_file' && allowedUnmanifested.has(f.path)) || (f.category === 'public_snapshot_file_mismatch' && allowedMismatch.has(f.path)) || (f.category === 'public_snapshot_file_missing' && removed.has(f.path))));
          if (!report.source || report.source.manifest_bound !== true) { console.error('snapshot manifest not bound'); process.exit(1); }
          if (bad.length > 0) { console.error(JSON.stringify(bad, null, 2)); process.exit(1); }
          const suffix = ['users', 'noreply.github.com'].join('.');
          const identities = new Set(run('git log --format=%ae%x0a%ce').split(/\s+/).filter(Boolean));
          for (const id of identities) { if (!id.endsWith('@' + suffix)) { console.error('unexpected history identity'); process.exit(1); } }
          console.log('public snapshot gate passed: ' + report.summary.files_scanned + ' files scanned, manifest-bound, identities clean');
          "
